<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>নদী — সোনালি বিকেলে বাংলার এক নদী</title>
    <meta name="description" content="রিয়েল-টাইম 3D: সোনালি বিকেলে বাংলার এক নদী দিয়ে মাঝির নৌকা ভেসে চলে, দুই পাড়ে কাশবন, গ্রাম আর ধানক্ষেত।" />
    <meta name="theme-color" content="#0d0f0e" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@300;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0f0e;
        --ink: #ecd3a8;
        --ink-dim: rgba(236, 211, 168, 0.62);
        --font: 'Noto Serif Bengali', 'Nirmala UI', 'Vrinda', serif;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: var(--font);
        color: var(--ink);
      }
      canvas#c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        outline: none;
        cursor: grab;
      }
      canvas#c:active {
        cursor: grabbing;
      }

      /* loader: a ring fills while the river is built; inside it the sun sets behind a boat */
      #load {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 52%, #1a1b17 0%, var(--bg) 70%);
        transition: opacity 1.2s ease;
        z-index: 3;
        pointer-events: none;
      }
      #load.done {
        opacity: 0;
      }
      #load svg {
        width: min(150px, 36vw);
        height: auto;
        overflow: visible;
      }
      #load .track {
        fill: none;
        stroke: rgba(236, 211, 168, 0.08);
        stroke-width: 1.6;
      }
      #load #load-arc {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0.98;
        transition: stroke-dashoffset 0.5s cubic-bezier(0.3, 0.7, 0.2, 1);
      }
      #load .sun {
        fill: #f0b36a;
        opacity: 0.85;
        animation: sink 6s ease-in-out infinite alternate;
      }
      #load .wave {
        fill: none;
        stroke: var(--ink-dim);
        stroke-width: 1.4;
        stroke-linecap: round;
        animation: drift 3.6s ease-in-out infinite alternate;
      }
      #load .wave.b {
        animation-delay: -1.8s;
        opacity: 0.6;
      }
      #load .boat {
        fill: var(--ink);
        animation: bob 3s ease-in-out infinite;
      }
      @keyframes sink {
        from { transform: translateY(-3px); }
        to { transform: translateY(4px); }
      }
      @keyframes drift {
        from { transform: translateX(-3px); }
        to { transform: translateX(3px); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(1px) rotate(-1.5deg); }
      }

      #title {
        position: fixed;
        left: 50%;
        top: 16vh;
        transform: translate(-50%, 8px);
        text-align: center;
        opacity: 0;
        transition: opacity 2.4s ease, transform 2.4s ease;
        pointer-events: none;
        z-index: 2;
        text-shadow: 0 1px 18px rgba(30, 14, 0, 0.55);
        padding: 0 16px;
        width: min(560px, calc(100vw - 32px));
      }
      #title.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #title h1 {
        margin: 0;
        font-weight: 500;
        font-size: clamp(44px, 9vw, 84px);
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      #title p {
        margin: 8px 0 0;
        font-weight: 300;
        font-size: clamp(15px, 2.4vw, 20px);
        color: var(--ink-dim);
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: max(22px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        margin: 0;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(12, 10, 8, 0.38);
        backdrop-filter: blur(6px);
        font-size: 14px;
        color: var(--ink-dim);
        white-space: nowrap;
        opacity: 0;
        transition: opacity 1.4s ease;
        pointer-events: none;
        z-index: 2;
        max-width: calc(100vw - 32px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hint.show {
        opacity: 1;
      }
      #hint kbd {
        font-family: inherit;
        border: 1px solid rgba(236, 211, 168, 0.35);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 12px;
      }
      #caption {
        position: fixed;
        left: 50%;
        bottom: 6%;
        transform: translate(-50%, 50%);
        margin: 0;
        padding: 0 16px;
        font-size: clamp(16px, 2.6vw, 26px);
        font-weight: 300;
        letter-spacing: 0.04em;
        color: var(--ink);
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.7);
        opacity: 0;
        pointer-events: none;
        z-index: 2;
        white-space: nowrap;
      }
      #sound,
      #film {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(236, 211, 168, 0.3);
        background: rgba(12, 10, 8, 0.35);
        backdrop-filter: blur(6px);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 1.2s ease, background 0.2s ease;
        z-index: 2;
      }
      #film {
        right: calc(max(16px, env(safe-area-inset-right)) + 54px);
      }
      #sound.show,
      #film.show {
        opacity: 0.85;
      }
      #sound:hover,
      #sound:focus-visible,
      #film:hover,
      #film:focus-visible {
        opacity: 1;
        background: rgba(12, 10, 8, 0.6);
      }
      #film.on {
        background: rgba(236, 211, 168, 0.18);
      }
      #sound:focus-visible,
      #film:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #sound .waves {
        opacity: 0.25;
        transition: opacity 0.3s ease;
      }
      #sound.on .waves {
        opacity: 1;
      }
      #err {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-size: 18px;
        color: var(--ink);
        background: var(--bg);
        z-index: 4;
      }
      #err[hidden] {
        display: none;
      }
      @media (max-width: 640px) {
        #hint {
          font-size: 12px;
          white-space: normal;
          text-align: center;
          border-radius: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #load .sun,
        #load .wave,
        #load .boat {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="c" tabindex="0" aria-label="সোনালি বিকেলে বাংলার এক নদীর 3D দৃশ্য। টেনে বা তীর-চাবি দিয়ে চারপাশ দেখুন।"></canvas>

    <div id="load" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="46" />
        <circle id="load-arc" cx="60" cy="60" r="46" pathLength="1" transform="rotate(-90 60 60)" />
        <circle class="sun" cx="60" cy="62" r="13" />
        <path class="wave" d="M30 72 Q40 69 50 72 T70 72 T90 72" />
        <path class="wave b" d="M36 79 Q46 76 56 79 T76 79 T86 79" />
        <path class="boat" d="M41 69 Q60 74 79 69 L76 66 Q60 69 44 66 Z M55 66 Q60 58 66 66 Z" />
      </svg>
    </div>

    <div id="title" aria-live="polite">
      <h1>নদী</h1>
      <p>সোনালি বিকেলে বাংলার এক নদী</p>
    </div>

    <p id="hint">
      টেনে চারপাশ দেখুন · স্ক্রল করে কাছে-দূরে · <kbd>C</kbd> চলচ্চিত্র · <kbd>T</kbd> চেপে ধরলে সময় দ্রুত · <kbd>M</kbd> শব্দ
    </p>

    <p id="caption" aria-live="polite"></p>

    <button id="film" type="button" aria-pressed="false" aria-label="চলচ্চিত্র দেখুন">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="6" width="13" height="12" rx="2" />
        <path d="M16 10.5l5-3v9l-5-3z" />
      </svg>
    </button>

    <button id="sound" type="button" aria-pressed="false" aria-label="শব্দ চালু করুন">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
        <g class="waves">
          <path d="M15.5 9a4 4 0 0 1 0 6" />
          <path d="M18 6.5a7.5 7.5 0 0 1 0 11" />
        </g>
      </svg>
    </button>

    <div id="err" role="alert" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
